openapi: 3.1.0
info:
  title: Na'aseh Native Client Additions
  version: 1.0.0
  description: >-
    Backward-compatible additions for Apple native clients. Existing auth, sync, task, list,
    journal, file, export, report, and profile APIs remain authoritative and unchanged. Google Tasks
    synchronization is retired and is not part of the native contract.
servers:
  - url: https://gsd.thepandas.link
paths:
  /api/client/compatibility:
    get:
      operationId: getNativeClientCompatibility
      summary: Determine whether this native build may read and mutate production data.
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientBuild'
        - $ref: '#/components/parameters/ContractVersion'
      responses:
        '200':
          description: Compatibility decision. An unsupported client fails closed before mutation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /api/client/telemetry:
    post:
      operationId: ingestNativeClientTelemetry
      summary: Record a bounded batch of authenticated content-free native client diagnostics.
      description: >-
        Delivery is best-effort and never changes a user-operation result. The server validates the
        closed schema, writes structured CloudWatch events and bounded metrics, and does not persist
        the batch in application data storage.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientBuild'
        - $ref: '#/components/parameters/ContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeTelemetryBatch'
      responses:
        '204':
          description: Validated events were accepted for structured logging.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /api/notifications/native:
    post:
      operationId: registerNativeInstallation
      summary: Register or rotate an authenticated installation's APNs token and privacy policy.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/ClientBuild'
        - $ref: '#/components/parameters/ContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeRegistration'
      responses:
        '204':
          description: Registration stored or updated idempotently.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: unregisterNativeInstallation
      summary: Idempotently disable this installation's native notifications.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfToken'
        - name: installationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Registration absent or disabled.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-naaseh
      description: Existing revocable opaque session cookie; native clients retain it in Keychain.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        const: https://gsd.thepandas.link
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
    ClientPlatform:
      name: X-Naaseh-Client-Platform
      in: header
      required: true
      schema:
        type: string
        enum: [ios, ipados, macos]
    ClientBuild:
      name: X-Naaseh-Client-Build
      in: header
      required: true
      schema:
        type: integer
        minimum: 1
    ContractVersion:
      name: X-Naaseh-Contract-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    CompatibilityResponse:
      type: object
      additionalProperties: false
      required: [mode, minimumBuild, latestBuild, supportedContractVersions, messageCode]
      properties:
        mode:
          type: string
          enum: [supported, upgradeRequired, temporarilyUnavailable]
        minimumBuild:
          type: integer
          minimum: 1
        latestBuild:
          type: integer
          minimum: 1
        supportedContractVersions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
        messageCode:
          type: string
          enum: [ok, update_required, beta_expired, service_temporarily_unavailable]
    NativeRegistration:
      type: object
      additionalProperties: false
      required:
        - installationId
        - platform
        - appVersion
        - buildNumber
        - contractVersion
        - apnsEnvironment
        - apnsToken
        - previewPolicy
      properties:
        installationId:
          type: string
          format: uuid
        platform:
          type: string
          enum: [ios, ipados, macos]
        appVersion:
          type: string
          minLength: 1
          maxLength: 40
        buildNumber:
          type: integer
          minimum: 1
        contractVersion:
          type: integer
          minimum: 1
        apnsEnvironment:
          type: string
          enum: [sandbox, production]
        apnsToken:
          type: string
          pattern: '^[A-Fa-f0-9]{64,512}$'
        previewPolicy:
          type: string
          enum: [generic, nonPrivateTaskName]
        capabilities:
          type: object
          additionalProperties: false
          properties:
            alerts:
              type: boolean
            badges:
              type: boolean
            sounds:
              type: boolean
            liveActivities:
              type: boolean
    NativeTelemetryBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/NativeTelemetryEvent'
    NativeTelemetryEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - occurredAt
        - platform
        - appVersion
        - buildNumber
        - contractVersion
        - operationClass
        - outcome
        - errorClass
        - retryable
        - correlationId
      properties:
        eventId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        platform:
          type: string
          enum: [ios, ipados, macos]
        appVersion:
          type: string
          minLength: 1
          maxLength: 40
        buildNumber:
          type: integer
          minimum: 1
        contractVersion:
          type: integer
          minimum: 1
        operationClass:
          type: string
          enum:
            - migration
            - secureStore
            - crypto
            - sync
            - lifecycle
            - siri
            - notification
            - fileWorkflow
            - authentication
        outcome:
          type: string
          enum: [failed, blocked, recovered, retryScheduled]
        errorClass:
          type: string
          enum:
            - validation
            - authorization
            - storageUnavailable
            - storageCorrupt
            - missingKey
            - decryptionFailed
            - migrationFailed
            - networkUnavailable
            - dependencyFailed
            - incompatibleClient
            - cancelled
            - unknown
        durationMilliseconds:
          type: integer
          minimum: 0
          maximum: 3600000
        retryable:
          type: boolean
        queueDepthBucket:
          type: string
          enum: [zero, oneToTen, elevenToHundred, overHundred]
        freshnessBucket:
          type: string
          enum: [fresh, underHour, underDay, older, unknown]
        correlationId:
          type: string
          format: uuid
    Problem:
      type: object
      additionalProperties: false
      description: >-
        Safe RFC 7807-style error body used by the existing API. `type`, `title`, and `status`
        identify the problem class and HTTP result; `code` is the stable client decision key;
        `message` is safe user-facing text; and `correlationId` links the client report to redacted
        server diagnostics. Protected record values and implementation details are never included.
      required: [type, title, status, code, message, correlationId]
      properties:
        type:
          type: string
          format: uri
          pattern: '^urn:naaseh:problem:'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
  responses:
    Problem:
      description: Safe existing API problem envelope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
