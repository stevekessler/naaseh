name: Deploy staging
on: { workflow_dispatch: {} }
permissions: { contents: read, id-token: write }
concurrency: { group: staging, cancel-in-progress: false }
jobs:
  validate:
    uses: './.github/workflows/validate.yml'
  deploy:
    needs: validate
    environment: staging
    runs-on: ubuntu-latest
    env:
      NAASEH_DOMAIN_NAME: '${{ vars.NAASEH_DOMAIN_NAME }}'
      NAASEH_HOSTED_ZONE_ID: '${{ vars.NAASEH_HOSTED_ZONE_ID }}'
      NAASEH_HOSTED_ZONE_NAME: '${{ vars.NAASEH_HOSTED_ZONE_NAME }}'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Validate staging DNS configuration
        run: |
          test -n "$NAASEH_DOMAIN_NAME"
          test -n "$NAASEH_HOSTED_ZONE_ID"
          test -n "$NAASEH_HOSTED_ZONE_NAME"
          test "$NAASEH_DOMAIN_NAME" != gsd.thepandas.link
      - name: Build deployable web assets
        run: npm run build -w '@naaseh/web'
        env:
          VITE_WEB_PUSH_PUBLIC_KEY: '${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}'
      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: '${{ secrets.AWS_DEPLOY_ROLE_ARN }}'
          aws-region: us-west-2
      - run: >-
          npm run synth -w '@naaseh/infra' --
          -c breakGlassRoleArn=${{ secrets.RECOVERY_BREAK_GLASS_ROLE_ARN }}
      - run: npx cdk deploy --all --app infra/cdk.out --require-approval never
