name: Deploy production
on:
  workflow_dispatch:
    inputs:
      change_ticket:
        description: Approved production change or release identifier
        required: true
        type: string
      rollback_ref:
        description: Full 40-character commit SHA for the currently deployed known-good release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  validate:
    uses: './.github/workflows/validate.yml'
  deploy:
    needs: validate
    environment: production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BREAK_GLASS_ROLE: '${{ secrets.RECOVERY_BREAK_GLASS_ROLE_ARN }}'
      NAASEH_DOMAIN_NAME: '${{ vars.NAASEH_DOMAIN_NAME }}'
      NAASEH_HOSTED_ZONE_ID: '${{ vars.NAASEH_HOSTED_ZONE_ID }}'
      NAASEH_HOSTED_ZONE_NAME: '${{ vars.NAASEH_HOSTED_ZONE_NAME }}'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Build deployable web assets
        run: npm run build -w '@naaseh/web'
        env:
          VITE_WEB_PUSH_PUBLIC_KEY: '${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}'
      - name: Validate immutable deployment inputs without printing values
        env:
          ROLLBACK_REF: '${{ inputs.rollback_ref }}'
        run: |
          test "$GITHUB_REF" = refs/heads/main
          printf '%s' "$ROLLBACK_REF" | grep -Eq '^[0-9a-f]{40}$'
          test -n "$BREAK_GLASS_ROLE"
          test "$NAASEH_DOMAIN_NAME" = gsd.thepandas.link
          test "$NAASEH_HOSTED_ZONE_ID" = Z03233042WRAYW9S16I7T
          test "$NAASEH_HOSTED_ZONE_NAME" = thepandas.link
      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: '${{ secrets.AWS_DEPLOY_ROLE_ARN }}'
          role-session-name: naaseh-production-deploy
          aws-region: us-west-2
      - name: Synthesize reviewed production template
        run: |
          npm run synth -w '@naaseh/infra' -- -c "breakGlassRoleArn=$BREAK_GLASS_ROLE"
      - name: Deploy with CloudFormation rollback enabled
        run: npx cdk deploy --all --app infra/cdk.out --require-approval never --rollback
  smoke:
    needs: deploy
    environment: production
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_BASE_URL: '${{ vars.PRODUCTION_BASE_URL }}'
      PRODUCTION_SMOKE_USERNAME: '${{ secrets.PRODUCTION_SMOKE_USERNAME }}'
      PRODUCTION_SMOKE_PASSWORD: '${{ secrets.PRODUCTION_SMOKE_PASSWORD }}'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Build known-good web assets
        run: npm run build -w '@naaseh/web'
        env:
          VITE_WEB_PUSH_PUBLIC_KEY: '${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}'
      - run: npx playwright install --with-deps chromium
      - name: Validate production smoke-test configuration
        run: |
          test "$PRODUCTION_BASE_URL" = https://gsd.thepandas.link
          test -n "$PRODUCTION_SMOKE_USERNAME"
          test -n "$PRODUCTION_SMOKE_PASSWORD"
      - name: Run production canary without logging credentials
        run: npm run test:e2e -- --project=chromium tests/e2e/production-smoke.spec.ts
  rollback:
    needs: [deploy, smoke]
    if: ${{ always() && needs.deploy.result == 'success' && needs.smoke.result == 'failure' }}
    environment: production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BREAK_GLASS_ROLE: '${{ secrets.RECOVERY_BREAK_GLASS_ROLE_ARN }}'
      NAASEH_DOMAIN_NAME: '${{ vars.NAASEH_DOMAIN_NAME }}'
      NAASEH_HOSTED_ZONE_ID: '${{ vars.NAASEH_HOSTED_ZONE_ID }}'
      NAASEH_HOSTED_ZONE_NAME: '${{ vars.NAASEH_HOSTED_ZONE_NAME }}'
    steps:
      - name: Check out the explicitly supplied known-good release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: '${{ inputs.rollback_ref }}'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Build known-good web assets for rollback
        run: npm run build -w '@naaseh/web'
        env:
          VITE_WEB_PUSH_PUBLIC_KEY: '${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}'
      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: '${{ secrets.AWS_DEPLOY_ROLE_ARN }}'
          role-session-name: naaseh-production-rollback
          aws-region: us-west-2
      - name: Redeploy the known-good release
        run: |
          npm run synth -w '@naaseh/infra' -- -c "breakGlassRoleArn=$BREAK_GLASS_ROLE"
          npx cdk deploy --all --app infra/cdk.out --require-approval never --rollback
